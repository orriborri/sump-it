[package]
name = "coffee-brewer-backend"
version = "0.1.0"
edition = "2021"
description = "Rust backend for consolidated coffee brewing application with tRPC"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono", "uuid"] }
anyhow = "1.0"
thiserror = "1.0"
validator = { version = "0.18", features = ["derive"] }
argon2 = "0.5"
jsonwebtoken = "9.0"
dotenv = "0.15"
tarpc = { version = "0.32", features = ["full"] }

# Development dependencies
[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
testcontainers = "0.15"
rstest = "0.18"

[features]
default = []
test-utils = []