[package]
name = "coffee-brewer-backend"
version = "0.1.0"
edition = "2021"
description = "Rust backend for consolidated coffee brewing application (REST)"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "macros", "migrate", "chrono", "uuid"] }
anyhow = "1.0"
thiserror = "1.0"
validator = { version = "0.18", features = ["derive"] }
dotenv = "0.15"
# Generates TypeScript types from the Rust request/response models so the
# frontend consumes a single source of truth. `chrono-impl`/`uuid-impl` teach
# ts-rs how to render the chrono and uuid types used by the models.
ts-rs = { version = "12.0", features = ["chrono-impl", "uuid-impl"] }

# Development dependencies
[dev-dependencies]
# Drive the real axum router in-process in the DB integration tests:
# `tower`'s `util` feature provides `ServiceExt::oneshot`, and
# `http-body-util` collects the response body. Both are already in the tree as
# transitive deps of axum; declaring them here makes them usable from tests.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []

# `coverage_nightly` is a custom cfg set by the coverage harness (see
# `docs/coverage.md` and the `coverage` npm/make target). Registering it here
# keeps `cargo build`/`clippy` free of `unexpected_cfgs` warnings while the cfg
# stays off for ordinary builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
